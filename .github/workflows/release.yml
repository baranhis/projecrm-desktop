# Sürüm paketleri: v* etiketi atılınca Windows (.exe NSIS) ve macOS (.dmg) derlenir,
# GitHub Release'e taslak olarak eklenir. İmzalama anahtarları eklenince (bkz. README)
# aynı iş akışı imzalı paket üretir.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Noter onayı için App Store Connect API anahtarı (.p8) gizli değişkenden dosyaya yazılır.
      - name: Apple API anahtarını hazırla
        if: matrix.platform == 'macos-latest' && env.APPLE_API_KEY_P8 != ''
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS imzalama: Developer ID sertifikası (p12, base64) + parola + kimlik
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS noter onayı: App Store Connect API anahtarı (boşsa noter atlanır, imza yine atılır)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Otomatik güncelleme imzası (sonraki adım): TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Proje CRM ${{ github.ref_name }}"
          releaseBody: "Proje CRM masaüstü uygulaması. Windows: .exe, macOS: .dmg"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
